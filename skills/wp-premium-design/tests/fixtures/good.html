<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: good page</title>
<style>
  /* the same page with the problems fixed */
  html { scroll-padding-top: 96px; }
  body { margin: 0; font: 17px/1.6 Georgia, serif; color: #1a2a33; background: #f6f8f9; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 80px; background: #fff; border-bottom: 1px solid #ccd; z-index: 10; display: flex; align-items: center; gap: 24px; padding: 0 24px; }
  main { padding-top: 96px; }
  section { min-height: 700px; padding: 48px 24px; border-bottom: 1px solid #dde; }
  .promo { background: #0b5d7a; color: #fff; padding: 32px; transition: background-color .2s ease; }
  /* a reveal that works: hidden only once JS is running, visible with reduced motion */
  .js .reveal { opacity: 0; transform: translateY(24px); transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1); }
  .js .reveal.is-in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .js .reveal { opacity: 1; transform: none; transition: none; } }
  input { font-size: 16px; padding: 12px; }
  a { color: #0b5d7a; }
  .links a { display: inline-block; margin: 8px 12px 8px 0; }
  :focus-visible { outline: 2px solid #0b5d7a; outline-offset: 2px; }
</style>
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="bar"><strong>Fixture</strong><a href="#s2">Stages</a><a href="#s3">Contact</a></header>
<main id="main">
  <section id="s1"><h1>No planted problems</h1><p class="promo">Solid brand-colour block.</p>
    <div class="links"><a href="#s1">One</a><a href="#s2">Two</a><a href="#s3">Three</a><a href="#s4">Four</a></div></section>
  <section id="s2"><h2>Stages</h2><p class="reveal">This paragraph is revealed when it enters the viewport.</p>
    <div class="links"><a href="#s1">Back</a><a href="#s3">Next</a><a href="#s4">Last</a></div></section>
  <section id="s3"><h2>Contact</h2><form><label for="em">Email</label> <input id="em" type="email" autocomplete="email"></form>
    <div class="links"><a href="#s1">Top</a><a href="#s2">Stages</a></div></section>
  <section id="s4"><h2>Light</h2><p>Nothing blocks the main thread.</p><div class="links"><a href="#s1">Top</a><a href="#s3">Contact</a></div></section>
</main>
<footer><p>Footer</p></footer>
<script>
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
